<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1769e0">
  <title>Aplikasi Laundry & Keuangan</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- HEADER -->
  <header class="topbar">
    <div style="flex:1; overflow:hidden;">
      <marquee direction="left" scrollamount="6" style="color: #FDE047; font-size: 1.1rem; font-weight: 600; text-shadow: 1px 1px 4px rgba(0,0,0,0.2);">
        Selamat datang di <span class="dynamic-outlet-name" style="font-size: 1.3rem; font-weight: 800; color: #FFB703;">Arsy Laundry</span> ✨
      </marquee>
    </div>
    <div class="profile-icon" id="headerProfileIcon">AL</div>
  </header>

  <main class="container">

    <!-- 🏠 DASHBOARD PAGE -->
    <section id="dashboardPage" class="page active">
      <!-- Banner Keuangan Khusus Admin -->
      <div class="welcome-card admin-only" onclick="showPage('keuanganPage')">
        <div>
          <p>Kelola Pengeluaran Keuangan</p>
          <h2 class="dynamic-outlet-name">Arsy Laundry</h2>
        </div>
        <span class="laundry-icon">🧺</span>
      </div>

      <div class="stat-grid">
        <div class="stat-card" onclick="openDashboardDetail('omset')" style="cursor:pointer;">
          <span class="stat-icon blue">💰</span>
          <p>Omzet Hari Ini</p>
          <h3 id="todayIncome">Rp0</h3>
        </div>
        <div class="stat-card" onclick="openDashboardDetail('transaksi')" style="cursor:pointer;">
          <span class="stat-icon green">🧾</span>
          <p>Transaksi Hari Ini</p>
          <h3 id="todayTransactions">0</h3>
        </div>
        <div class="stat-card" onclick="openDashboardDetail('pending')" style="cursor:pointer;">
          <span class="stat-icon orange">⏳</span>
          <p>Belum Selesai</p>
          <h3 id="pendingTransactions">0</h3>
        </div>
        <div class="stat-card" onclick="showPage('customerPage')" style="cursor:pointer;">
          <span class="stat-icon purple">👥</span>
          <p>Total Pelanggan</p>
          <h3 id="totalCustomers">0</h3>
        </div>
      </div>

      <div class="section-title"><h2>Aksi Cepat</h2></div>
      <div class="quick-actions">
        <button class="quick-button" onclick="openTransactionModal()"><span>➕</span><b>Transaksi Baru</b></button>
        <button class="quick-button" onclick="showPage('servicesPage')"><span>🧼</span><b>Layanan</b></button>
        <button class="quick-button admin-only" onclick="showPage('reportsPage')"><span>📊</span><b>Laporan</b></button>
        <button class="quick-button" onclick="showPage('akunPage')"><span>⚙️</span><b>Akun & Nota</b></button>
      </div>

      <div class="section-title">
        <h2>Transaksi Terbaru</h2>
        <button class="link-button" onclick="showPage('transactionsPage')">Lihat Semua</button>
      </div>
      <div id="recentTransactions" class="transaction-list"></div>
    </section>

    <!-- 📋 TRANSAKSI PAGE -->
    <section id="transactionsPage" class="page">
      <div style="overflow-x: auto; white-space: nowrap; background: white; padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; gap: 8px;">
        <button class="trans-tab active" onclick="filterTransactionsTab('Antrian', this)" style="background:#e1edff; color:var(--primary); padding:8px 14px; border-radius:20px; font-weight:bold; border:0;">Antrian</button>
        <button class="trans-tab" onclick="filterTransactionsTab('Proses', this)" style="background:#f4f7fb; color:var(--muted); padding:8px 14px; border-radius:20px; font-weight:bold; border:0;">Proses</button>
        <button class="trans-tab" onclick="filterTransactionsTab('Siap Diambil', this)" style="background:#f4f7fb; color:var(--muted); padding:8px 14px; border-radius:20px; font-weight:bold; border:0;">Siap Diambil</button>
        <button class="trans-tab" onclick="filterTransactionsTab('Selesai', this)" style="background:#f4f7fb; color:var(--muted); padding:8px 14px; border-radius:20px; font-weight:bold; border:0;">Selesai</button>
      </div>
      <div style="padding: 10px 15px; background: white; border-bottom: 1px solid var(--border); position: relative;">
        <i class="fas fa-search" style="position:absolute; left:25px; top:22px; color:var(--muted);"></i>
        <input type="text" id="transactionSearchInput" placeholder="Cari nama pelanggan..." style="width:100%; padding:10px 10px 10px 35px; border:1px solid var(--border); border-radius:8px;" onkeyup="renderAllTransactions()">
      </div>
      <div id="allTransactions" class="transaction-list" style="padding: 15px;"></div>
    </section>

    <!-- 🧼 LAYANAN PAGE -->
    <section id="servicesPage" class="page">
      <div class="page-heading" style="padding: 0 15px;">
        <h2>Daftar Layanan</h2>
        <button class="primary-button admin-only" onclick="openServiceModal()" style="width: auto;">+ Tambah</button>
      </div>
      <div id="servicesList" class="service-list" style="padding: 0 15px;"></div>
    </section>

    <!-- 👥 PELANGGAN PAGE -->
    <section id="customerPage" class="page">
      <div class="report-header">
        <button onclick="showPage('dashboardPage')" class="report-back">‹</button>
        <h2 style="font-size:18px; font-weight:bold;">Daftar Pelanggan</h2>
      </div>
      <div style="padding: 15px;" id="customersListContainer"></div>
    </section>
    
    <section id="customerDetailPage" class="page">
      <div class="report-header">
        <button onclick="showPage('customerPage')" class="report-back">‹</button>
        <h2 id="customerDetailTitle" style="font-size:16px; font-weight:bold;">Riwayat Pelanggan</h2>
      </div>
      <div style="padding: 15px;" id="customerDetailContent"></div>
    </section>

    <!-- 📊 LAPORAN PAGE (Hanya Admin) -->
    <section id="reportsPage" class="page admin-only">
      <div class="report-header">
        <button class="report-back" onclick="showPage('dashboardPage')">‹</button>
        <div><h1 style="font-size:20px;">Laporan</h1><p style="margin:0; font-size:12px;">Aktivitas <span class="dynamic-outlet-name">Arsy Laundry</span></p></div>
      </div>
      <div class="report-content">
        <div class="report-menu">
          <button class="report-menu-item" onclick="openReportDetail('omset', 'Laporan Omset')"><div class="report-menu-icon">📊</div><div class="report-menu-text"><strong>Laporan Omset</strong><small>Omzet seluruh transaksi</small></div><div class="report-menu-arrow">›</div></button>
          <button class="report-menu-item" onclick="openReportDetail('masuk', 'Transaksi Masuk')"><div class="report-menu-icon">📥</div><div class="report-menu-text"><strong>Transaksi Masuk</strong><small>Semua data transaksi</small></div><div class="report-menu-arrow">›</div></button>
          <button class="report-menu-item" onclick="openReportDetail('lunas', 'Transaksi Lunas')"><div class="report-menu-icon">💰</div><div class="report-menu-text"><strong>Transaksi Lunas</strong><small>Transaksi yang sudah lunas</small></div><div class="report-menu-arrow">›</div></button>
        </div>
      </div>
    </section>
